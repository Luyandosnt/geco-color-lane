name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "tsconfig*.json"
      - "capacitor.config.*"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install web dependencies
        run: npm ci

      - name: Install Capacitor build tools
        run: npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Build web game
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Lock Android orientation to portrait
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text(encoding='utf-8')
          marker = 'android:name=".MainActivity"'
          if marker not in text:
              raise SystemExit('MainActivity not found in AndroidManifest.xml')
          if 'android:screenOrientation=' not in text:
              text = text.replace(marker, marker + '\n            android:screenOrientation="portrait"', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: inshimu-origins-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
